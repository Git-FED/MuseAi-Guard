[pytest]
# The project tests (tests/) and the packaged tool tests (tools/muse-tests/)
# both contain a file named test_proxy.py. importlib import mode lets pytest
# collect both suites in one run without duplicate-basename collisions, so the
# documented command `python -m pytest` (or `python -m pytest tests/ tools/muse-tests/`)
# just works.
addopts = --import-mode=importlib
testpaths = tests tools/muse-tests
